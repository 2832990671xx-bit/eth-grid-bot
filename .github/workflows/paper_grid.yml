name: Paper Grid Bot

on:
  schedule:
    # 每30分钟 8:00-23:00 CST (UTC 0:00-15:00)
    - cron: '*/30 0-15 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  run-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install ccxt

      - name: Run grid bot
        run: python3 trading/paper_grid_gh.py

      - name: Commit state back
        run: |
          git config user.name "Grid Bot"
          git config user.email "bot@eth-grid.xyz"
          git add trading/paper_state.json
          git diff --staged --quiet && exit 0
          git commit -m "auto: update grid state [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push
